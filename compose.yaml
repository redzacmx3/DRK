# Development only: HTTPS with a local development certificate. Loopback binding is intentional.
services:
  inventory:
    environment:
      DRK_CLAMD_ADDRESS: ${DRK_CLAMD_ADDRESS:-}
      # Startup default; saved web administration survives unchanged restarts.
      DRK_MODULES: ${DRK_MODULES:-all}
    build: .
    image: drk-inventory:dev
    network_mode: host
    command: ["serve", "--db", "/data/inventory.db", "--setup-code-file", "/data/setup-code.txt", "--device-reminders=${DRK_DEVICE_REMINDERS:-true}", "--reminder-days", "${DRK_REMINDER_DAYS:-60,30,7}", "--listen", "127.0.0.1:8080", "--tls-cert", "/certs/cert.pem", "--tls-key", "/certs/key.pem"]
    user: "1000:1000"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - inventory_data:/data
      - ./var/tls:/certs:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=1770
    healthcheck:
      test: ["CMD", "/app/inventory", "healthcheck", "--url", "https://localhost:8080/health/ready", "--ca", "/certs/cert.pem"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    stop_grace_period: 10s
volumes:
  inventory_data:
