# Development only: no login yet. Loopback binding is intentional.
services:
  inventory:
    build: .
    image: drk-inventory:dev
    network_mode: host
    command: ["serve", "--db", "/data/inventory.db", "--listen", "127.0.0.1:8080"]
    user: "1000:1000"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - inventory_data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=1770
    healthcheck:
      test: ["CMD", "/app/inventory", "healthcheck", "--url", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 10s
volumes:
  inventory_data:
